# examples/pam-jwt.conf
#
# Example PAM configuration snippet for pam_jwt.so. This file is meant to be
# either:
#
#   1. Copied into /etc/pam.d/<service> and edited to fit the service, or
#   2. Referenced from another PAM service file (e.g. with `include`).
#
# It is installed as /usr/local/share/pam-jwt/pam-jwt.conf by `make install`
# for reference only; PAM itself does not read this path automatically.
#
# ---------------------------------------------------------------------------
# Required: cert_file
# ---------------------------------------------------------------------------
# Path to the issuer X.509 certificate (PEM). The public key extracted from
# this certificate is the only key material trusted to verify incoming JWTs.
#
# The file must be readable by the process performing authentication and
# SHOULD NOT be world-writable (the module warns at debug level if it is).
#
cert_file=/etc/pam-jwt/issuer.pem

# ---------------------------------------------------------------------------
# Optional: issuer
# ---------------------------------------------------------------------------
# When set, the JWT's `iss` claim must equal this string. Useful for
# multi-tenant setups where one IdP serves several audiences and you want
# to pin authentication to a specific issuer URL.
#
# issuer=https://idp.example.com/

# ---------------------------------------------------------------------------
# Optional: audience
# ---------------------------------------------------------------------------
# When set, the JWT's `aud` claim must contain this string. The module
# checks for *containment* (so a JWT with `aud: ["a","b"]` is accepted for
# audience=b). Useful when the same IdP issues tokens for multiple apps.
#
# audience=myapp

# ---------------------------------------------------------------------------
# Optional: map_field
# ---------------------------------------------------------------------------
# When set, the PAM user is taken from this JWT claim instead of from
# pam_get_user(). For example, map_field=sub sets the PAM user to the
# value of the `sub` claim. Independent from match_field.
#
# map_field=preferred_username

# ---------------------------------------------------------------------------
# Optional: match_field
# ---------------------------------------------------------------------------
# When set, the value of this JWT claim must equal the user that initiated
# the authentication. Useful as a binding check that prevents a stolen
# token from being replayed against a different local account.
#
# Example: a JWT with `uid: alice` authenticates only when the PAM
# service is invoked for the `alice` account.
#
# match_field=uid

# ---------------------------------------------------------------------------
# Optional: fallback_user (requires map_field)
# ---------------------------------------------------------------------------
# When the verified token does not carry the map_field claim (the claim
# is missing or its value is the empty string), the verifier uses this
# value as the PAM user instead of rejecting the token. Useful when a
# service-account fallback must accept tokens issued for users that the
# IdP does not (yet) annotate with the mapped claim.
#
# The substitution only affects the mapping step: if match_field is
# also configured, the requested user is still compared against the
# match_field claim. Configuring fallback_user without map_field is
# rejected at parse time.
#
# fallback_user=service-acct

# ---------------------------------------------------------------------------
# Optional: clock_skew
# ---------------------------------------------------------------------------
# Leeway in seconds applied to the `exp` and `nbf` claims. Use this to
# tolerate small clock drift between the issuer and this host. Default
# is 0 (strict). 30-60 seconds is a reasonable value for most setups.
#
# clock_skew=30

# ---------------------------------------------------------------------------
# Optional: debug
# ---------------------------------------------------------------------------
# When set, the module emits verbose pam_syslog() messages at LOG_DEBUG
# under the authpriv facility. Helpful when first deploying, but noisy.
# The module never logs the token, the authtok, or any private key
# material, with or without debug.
#
# debug

# ---------------------------------------------------------------------------
# Example full lines
# ---------------------------------------------------------------------------
#
# 1. Bare-bones RS256/ES256 check, no claim constraints, no user binding:
#
#    auth required pam_jwt.so cert_file=/etc/pam-jwt/issuer.pem
#
# 2. Production-style config: pin issuer + audience, bind to a claim,
#    tolerate 30s clock drift, and enable debug logging while bringing
#    the service up:
#
#    auth required pam_jwt.so \
#        cert_file=/etc/pam-jwt/issuer.pem \
#        issuer=https://idp.example.com/ \
#        audience=myapp \
#        match_field=uid \
#        clock_skew=30 \
#        debug
#
# 3. map_field with no match_field (user is taken from the JWT, no
#    binding check on the requested user):
#
#    auth required pam_jwt.so \
#        cert_file=/etc/pam-jwt/issuer.pem \
#        issuer=https://idp.example.com/ \
#        audience=myapp \
#        map_field=preferred_username
#
# 4. Both map_field and match_field on, consistent: requested user must
#    equal the value of match_field, AND the PAM user is overwritten
#    from map_field. Use this when the JWT carries both a stable
#    account id and a human-friendly name and you want to wire them
#    to the same local account.
#
#    auth required pam_jwt.so \
#        cert_file=/etc/pam-jwt/issuer.pem \
#        issuer=https://idp.example.com/ \
#        audience=myapp \
#        match_field=uid \
#        map_field=preferred_username
# 5. map_field with fallback_user: tokens missing the mapped claim
#    authenticate as a shared service account. match_field still binds
#    the requested user against a separate claim, so a stolen token
#    cannot be replayed under a different local account.
#
#    auth required pam_jwt.so \
#        cert_file=/etc/pam-jwt/issuer.pem \
#        issuer=https://idp.example.com/ \
#        audience=myapp \
#        match_field=uid \
#        map_field=preferred_username \
#        fallback_user=service-acct
